azure:
  enabled: false
  serviceAccountName: ""
  automountServiceAccountToken: true
  keyVault:
    name: ""
    secretProviderClass: "wso2am-cp-secret-provider-class"
    secretIdentifiers:
      secretEncryptionKey: ""
      internalKeystorePassword: ""
      internalKeystoreKeyPassword: ""
    activeDirectory:
      servicePrincipal:
        appId: ""
