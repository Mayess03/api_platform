apiVersion: cert-manager.io/v1
kind: Certificate

metadata:
  name: wso2-wildcard-cert
  namespace: apim-cp

spec:
  secretName: wso2-wildcard-tls

  issuerRef:
    name: wso2-local-ca
    kind: ClusterIssuer

  dnsNames:
    - am.wso2.com
    - gw.wso2.com
    - websocket.wso2.com
    - websub.wso2.com
    - km.wso2.com
    - kong.wso2.com
    - envoy.wso2.com

#requests the actual certificate from the issuer and stores it in a kubernetes secret named wso2-wildcard-tls