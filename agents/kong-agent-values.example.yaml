# Kong federated discovery agent — example values
# Chart: agent/apim-k8s-common-gw-helm, version 1.0.0-beta
# Agent pod namespace: apim-agent-kong
# Watches (dataPlane.namespace): apim-gw-kong
#
# IMPORTANT: this chart has hardcoded resource names for some cert-manager /
# ServiceAccount objects — do NOT install a second instance of this chart
# into the same namespace as this one, even under a different release name.
# Each agent gets its own dedicated namespace. See ARCHITECTURE.md section 2.
#
# helm install apim-kong-agent agent/apim-k8s-common-gw-helm --version 1.0.0-beta \
#   -f agents/kong-agent-values.yaml -n apim-agent-kong --create-namespace

wso2:
  subscription:
    imagePullSecrets: ""
replicaCount: 1
image:
  repository: wso2/apim-k8s-common-gw-connector
  tag: 1.0.0-beta
  pullPolicy: Always
service:
  name: apim-kong-agent-service
resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "456Mi"
    cpu: "200m"

controlPlane:
  enabled: true
  serviceURL: https://apim-wso2am-acp-service.apim-cp.svc.cluster.local:9443/
  username: admin
  password: "CHANGE_ME"
  environmentLabels: Kong   # must match the Gateway Environment name registered in Admin Portal
  skipSSLVerification: true
  eventListeningEndpoints: amqp://admin:CHANGE_ME@apim-wso2am-acp-service.apim-cp.svc.cluster.local:5672?retries='10'&connectdelay='30'
  certificates:
    caCertSecretName: "kong-agent-ca-certificate"

dataPlane:
  enabled: true
  GatewayHTTPPort: 8080
  GatewayHTTPSPort: 8443
  gatewayClassName: kong
  namespace: apim-gw-kong
  k8ResourceEndpoint: https://apim-wso2am-acp-service.apim-cp.svc.cluster.local:9443/api/configurator/apis/generate-k8s-resources

metrics:
  enabled: false

agent:
  mode: CPtoDP   # decide discovery-only vs deploy-mode — see ARCHITECTURE.md section 7
  gateway: kong

certmanager:
  enabled: true

logging:
  level: "DEBG"
  format: "TEXT"

serviceAccount:
  enableServiceAccountCreation: true
  enableClusterRoleCreation: true
  serviceAccountName: wso2agent-platform
  roleName: wso2agent-role

gatewayAgent:
  sandboxURLLabel: "sandbox"
  productionURLLabel: ""
