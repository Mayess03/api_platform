# Envoy Gateway (raw Gateway API, federated target) — example install values
# Namespace: apim-gw-envoy (Gateway + HTTPRoutes + backends all colocated here)
# Ports: 9080 (HTTP) / 9443 (HTTPS) — dedicated, does not compete for the
# shared LB IP used by CP/Universal Gateway. See PORTS.md.
#
# helm install eg oci://docker.io/envoyproxy/gateway-helm --version <PIN_ME> \
#   -n envoy-gateway-system --create-namespace
#
# Note: the Envoy Gateway *controller* always lives in envoy-gateway-system
# (chart-mandated). The Gateway *resource* you create afterward — with
# listeners on 9080/9443 — lives in apim-gw-envoy. Example Gateway resource:
#
# apiVersion: gateway.networking.k8s.io/v1
# kind: Gateway
# metadata:
#   name: envoy
#   namespace: apim-gw-envoy
# spec:
#   gatewayClassName: eg
#   listeners:
#     - name: http
#       port: 9080
#       protocol: HTTP
#       allowedRoutes:
#         namespaces:
#           from: Same
#     - name: https
#       port: 9443
#       protocol: HTTPS
#       hostname: envoy.wso2.com
#       allowedRoutes:
#         namespaces:
#           from: Same
#       tls:
#         mode: Terminate
#         certificateRefs:
#           - kind: Secret
#             name: wso2-wildcard-tls   # shared wildcard cert, see shared/certs/
