# WSO2 Universal Gateway (native data plane) — example install values
# Namespace: apim-gw-universal
# Ports: 80/443, shares the CP's shared LB IP via SNI (gw.wso2.com)
#
# helm install apim-gw wso2-gw/wso2am-gateway --version 4.7.0-1 \
#   -f gateways/universal/install-values.yaml -n apim-gw-universal --create-namespace
#
# Fill in once the distributed CP/GW pattern is being wired up — this is a
# Phase 4 concern (see ARCHITECTURE.md section 8, "Install Order"). Not
# needed for the initial Phase 1-3 single-node bring-up.

wso2:
  apim:
    configurations:
      # Point at the same DB / encryption key as control-plane/values.yaml
      databases:
        type: mysql
        jdbc:
          driver: com.mysql.cj.jdbc.Driver
        apim_db:
          url: jdbc:mysql://mysql.apim-cp.svc.cluster.local:3306/apim_db?useSSL=false
          username: "CHANGE_ME"
          password: "CHANGE_ME"
      encryption:
        key: "CHANGE_ME_SAME_AS_CP"
