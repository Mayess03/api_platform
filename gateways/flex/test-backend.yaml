apiVersion: apps/v1
kind: Deployment
metadata:
  name: flex-test-backend
  namespace: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flex-test-backend
  template:
    metadata:
      labels:
        app: flex-test-backend
    spec:
      containers:
        - name: whoami
          image: traefik/whoami
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: flex-test-backend
  namespace: gateway
spec:
  selector:
    app: flex-test-backend
  ports:
    - port: 80
      targetPort: 80